<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Finder</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e2e5eb;
    --accent: #2f6fed; --accent-soft: #e8f0ff; --good: #1f8a4c; --good-soft: #e3f5ea;
    --warn: #b26a00; --warn-soft: #fff3df; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c323d;
      --accent: #6b9bff; --accent-soft: #1f2b45; --good: #4cc27f; --good-soft: #17301f;
      --warn: #f0a640; --warn-soft: #33270f; --bad: #ff6b5b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  label.f { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  input[type=text], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; margin-top: 6px; }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line);
           border-radius: 8px; cursor: pointer; }
  .check input { margin-top: 3px; }
  .check small { color: var(--muted); display: block; }
  .opts { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); padding: 7px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 10px 22px; font-weight: 600; font-size: 16px; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.link { border: none; background: none; color: var(--accent); padding: 0; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1; min-width: 120px; }
  .progress div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .muted { color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=text] { flex: 1; min-width: 180px; }
  .toolbar select { width: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .job { display: flex; gap: 14px; justify-content: space-between; padding: 14px 4px; border-top: 1px solid var(--line); }
  .job:first-child { border-top: none; }
  .job h3 { margin: 0 0 2px; font-size: 16px; }
  .job h3 a { color: var(--text); text-decoration: none; }
  .job h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 14px; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .tag.new { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .tag.src { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .tag.applied { background: var(--good-soft); color: var(--good); font-weight: 600; }
  .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .actions button { font-size: 13px; padding: 5px 10px; white-space: nowrap; }
  .actions button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .job.dim { opacity: .5; }
  .links a { display: inline-block; margin: 4px 10px 4px 0; color: var(--accent); }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
  .empty { text-align: center; padding: 30px; color: var(--muted); }
  details summary { cursor: pointer; font-weight: 600; }
  @media (max-width: 600px) {
    .job { flex-direction: column; }
    .actions { flex-direction: row; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Finder</h1>
  <p class="sub">Type a country, pick the kinds of jobs you want, and press Search. You'll get the latest openings from LinkedIn plus remote jobs open to that country.</p>

  <div class="card">
    <div class="grid">
      <div>
        <label class="f" for="country">Country *</label>
        <input type="text" id="country" list="countryList" placeholder="e.g. India, United Kingdom, UAE">
      </div>
      <div>
        <label class="f" for="city">City / region (optional)</label>
        <input type="text" id="city" placeholder="e.g. Bengaluru">
      </div>
      <div>
        <label class="f" for="days">Posted within</label>
        <select id="days">
          <option value="1">Last 24 hours</option>
          <option value="3">Last 3 days</option>
          <option value="7" selected>Last 7 days</option>
          <option value="14">Last 2 weeks</option>
          <option value="30">Last 30 days</option>
        </select>
      </div>
      <div>
        <label class="f" for="pages">How deep to search</label>
        <select id="pages">
          <option value="1">Quick (fastest)</option>
          <option value="2" selected>Normal</option>
          <option value="4">Deep (slower, more results)</option>
        </select>
      </div>
    </div>

    <div style="margin-top:16px">
      <div class="row" style="justify-content:space-between">
        <label class="f" style="margin:0">Job types to search</label>
        <span><button class="link" id="allOn">Select all</button> · <button class="link" id="allOff">Clear</button></span>
      </div>
      <div class="cats" id="cats"></div>
    </div>

    <div style="margin-top:14px">
      <label class="f" for="custom">Extra search phrases (optional, one per line)</label>
      <textarea id="custom" placeholder="e.g.&#10;school psychologist&#10;NGO programme officer"></textarea>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="remote" checked> Include remote jobs</label>
      <label><input type="checkbox" id="hidesenior" checked> Hide senior / director roles</label>
      <label><input type="checkbox" id="entry"> Entry-level &amp; associate only (stricter)</label>
    </div>

    <div class="row" style="margin-top:18px">
      <button class="primary" id="go">Search jobs</button>
      <div class="progress" id="progWrap" hidden><div id="prog"></div></div>
      <span class="muted" id="status"></span>
    </div>
    <div class="err" id="errors"></div>
  </div>

  <div class="card" id="resultsCard" hidden>
    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter results by word (title, company, city)...">
      <select id="sort">
        <option value="date">Newest first</option>
        <option value="title">Title A–Z</option>
        <option value="company">Company A–Z</option>
      </select>
      <select id="show">
        <option value="active">Hide jobs I dismissed</option>
        <option value="all">Show everything</option>
        <option value="saved">Saved only</option>
        <option value="applied">Applied only</option>
        <option value="new">New since last search</option>
      </select>
      <button id="csv">Download CSV</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="muted" id="count" style="margin-bottom:6px"></div>
    <div id="list"></div>
  </div>

  <div class="card" id="linksCard" hidden>
    <details open>
      <summary>Also check these sites for <span id="linksCountry"></span></summary>
      <p class="muted" style="margin:8px 0">These sites don't let tools search them automatically, so each link opens a ready-made search.</p>
      <div class="links" id="links"></div>
    </details>
  </div>
</div>

<datalist id="countryList"></datalist>

<script>
const COUNTRIES = ["India","United Kingdom","United States","Canada","Australia","New Zealand","Ireland","Germany","Netherlands","France","Spain","Italy","Sweden","Norway","Denmark","Finland","Switzerland","Belgium","Austria","Portugal","Poland","United Arab Emirates","Saudi Arabia","Qatar","Oman","Kuwait","Bahrain","Singapore","Malaysia","Hong Kong","Japan","South Korea","Philippines","Indonesia","Thailand","Vietnam","Sri Lanka","Nepal","Bangladesh","Pakistan","South Africa","Kenya","Nigeria","Egypt","Uganda","Ghana","Rwanda","Ethiopia","Brazil","Mexico","Argentina","Chile","Colombia","Israel","Turkey","Greece"];
document.getElementById("countryList").innerHTML = COUNTRIES.map(c => `<option value="${c}">`).join("");

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let categories = [];
let jobs = new Map();          // id -> job
let marks = store.get("jf_marks", {});   // id -> "saved" | "applied" | "hidden"
let seen = new Set(store.get("jf_seen", []));
let activeCat = "all";

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function loadCategories() {
  const data = await (await fetch("/api/categories")).json();
  categories = data.categories;
  const chosen = store.get("jf_cats", categories.map(c => c.id));
  $("cats").innerHTML = categories.map(c => `
    <label class="check"><input type="checkbox" value="${c.id}" ${chosen.includes(c.id) ? "checked" : ""}>
      <span>${esc(c.name)}<small>${c.keywords.map(esc).join(" · ")}</small></span></label>`).join("");
}

function restoreForm() {
  const f = store.get("jf_form", {});
  for (const k of ["country","city","days","pages","custom"]) if (f[k] !== undefined) $(k).value = f[k];
  for (const k of ["remote","hidesenior","entry"]) if (f[k] !== undefined) $(k).checked = f[k];
}
function saveForm() {
  const f = {};
  for (const k of ["country","city","days","pages","custom"]) f[k] = $(k).value;
  for (const k of ["remote","hidesenior","entry"]) f[k] = $(k).checked;
  store.set("jf_form", f);
  store.set("jf_cats", [...document.querySelectorAll("#cats input:checked")].map(i => i.value));
}

$("allOn").onclick = () => document.querySelectorAll("#cats input").forEach(i => i.checked = true);
$("allOff").onclick = () => document.querySelectorAll("#cats input").forEach(i => i.checked = false);

async function runSearch() {
  const country = $("country").value.trim();
  if (!country) { $("country").focus(); $("errors").textContent = "Please type a country first."; return; }
  saveForm();
  const chosen = new Set([...document.querySelectorAll("#cats input:checked")].map(i => i.value));
  const tasks = [];
  for (const c of categories) if (chosen.has(c.id)) for (const k of c.keywords) tasks.push({ keyword: k, cat: c.name });
  for (const line of $("custom").value.split("\n")) if (line.trim()) tasks.push({ keyword: line.trim(), cat: "My extra searches" });
  if (!tasks.length) { $("errors").textContent = "Pick at least one job type or add an extra phrase."; return; }

  jobs = new Map(); activeCat = "all";
  const prevSeen = new Set(seen);
  const errors = new Set();
  $("errors").textContent = "";
  $("go").disabled = true; $("progWrap").hidden = false; $("resultsCard").hidden = false;
  renderLinks(country);

  const base = { country, city: $("city").value.trim(), days: $("days").value, pages: $("pages").value,
    remote: $("remote").checked ? 1 : 0, hidesenior: $("hidesenior").checked ? 1 : 0, entry: $("entry").checked ? 1 : 0 };
  let done = 0;
  const queue = [...tasks];
  async function worker() {
    while (queue.length) {
      const t = queue.shift();
      try {
        const qs = new URLSearchParams({ ...base, keyword: t.keyword });
        const res = await (await fetch("/api/search?" + qs)).json();
        (res.errors || []).forEach(e => errors.add(e));
        for (const j of res.jobs) {
          // merge duplicates (same id, or same title + company)
          const dupKey = (j.title + "|" + j.company).toLowerCase();
          let existing = jobs.get(j.id) || [...jobs.values()].find(x => x.dupKey === dupKey);
          if (existing) { existing.cats.add(t.cat); continue; }
          j.dupKey = dupKey; j.cats = new Set([t.cat]); j.isNew = !prevSeen.has(j.id);
          jobs.set(j.id, j);
        }
      } catch (e) { errors.add("Could not reach the Job Finder program. Is its window still open?"); }
      done++;
      $("prog").style.width = (100 * done / tasks.length) + "%";
      $("status").textContent = `Searching "${t.keyword}"… ${done}/${tasks.length} · ${jobs.size} jobs found`;
      render();
    }
  }
  await Promise.all([worker(), worker(), worker()]);

  for (const id of jobs.keys()) seen.add(id);
  store.set("jf_seen", [...seen].slice(-5000));
  $("go").disabled = false; $("progWrap").hidden = true;
  const newCount = [...jobs.values()].filter(j => j.isNew).length;
  $("status").textContent = `Done: ${jobs.size} jobs found` + (prevSeen.size ? `, ${newCount} new since your last search.` : ".");
  $("errors").textContent = errors.size ? "Some searches had problems: " + [...errors].slice(0, 4).join("; ") +
    (([...errors].some(e => e.includes("429"))) ? " (LinkedIn is limiting requests. Wait a few minutes or use Quick mode.)" : "") : "";
  render();
}
$("go").onclick = runSearch;
$("country").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

function ago(d) {
  if (!d) return "";
  const days = Math.floor((Date.now() - new Date(d + "T00:00:00").getTime()) / 86400000);
  return days <= 0 ? "today" : days === 1 ? "yesterday" : `${days} days ago`;
}

function visibleJobs() {
  const q = $("filter").value.trim().toLowerCase();
  const show = $("show").value;
  let list = [...jobs.values()].filter(j => {
    const m = marks[j.id];
    if (show === "active" && m === "hidden") return false;
    if (show === "saved" && m !== "saved") return false;
    if (show === "applied" && m !== "applied") return false;
    if (show === "new" && !j.isNew) return false;
    if (activeCat !== "all" && !j.cats.has(activeCat)) return false;
    if (q && !(j.title + " " + j.company + " " + j.location).toLowerCase().includes(q)) return false;
    return true;
  });
  const s = $("sort").value;
  list.sort((a, b) => s === "date" ? (b.posted || "").localeCompare(a.posted || "")
                     : (a[s] || "").localeCompare(b[s] || ""));
  return list;
}

function render() {
  const counts = {};
  for (const j of jobs.values()) for (const c of j.cats) counts[c] = (counts[c] || 0) + 1;
  $("chips").innerHTML = [`<button class="chip ${activeCat === "all" ? "on" : ""}" data-cat="all">All (${jobs.size})</button>`]
    .concat(Object.entries(counts).map(([c, n]) => `<button class="chip ${activeCat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(c)} (${n})</button>`)).join("");
  const list = visibleJobs();
  $("count").textContent = `Showing ${list.length} of ${jobs.size} jobs`;
  $("list").innerHTML = list.length ? list.slice(0, 600).map(j => {
    const m = marks[j.id];
    return `<div class="job ${m === "hidden" ? "dim" : ""}">
      <div>
        <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
        <div class="meta">${esc(j.company)}${j.company && j.location ? " · " : ""}${esc(j.location)}${j.posted ? " · " + ago(j.posted) : ""}</div>
        <div class="tags">
          ${j.isNew ? '<span class="tag new">NEW</span>' : ""}
          ${m === "applied" ? '<span class="tag applied">Applied</span>' : ""}
          <span class="tag src">${esc(j.source)}</span>
          ${[...j.cats].map(c => `<span class="tag">${esc(c)}</span>`).join("")}
        </div>
      </div>
      <div class="actions">
        <button data-id="${esc(j.id)}" data-mark="saved" class="${m === "saved" ? "on" : ""}">★ ${m === "saved" ? "Saved" : "Save"}</button>
        <button data-id="${esc(j.id)}" data-mark="applied" class="${m === "applied" ? "on" : ""}">✓ ${m === "applied" ? "Applied" : "Mark applied"}</button>
        <button data-id="${esc(j.id)}" data-mark="hidden" class="${m === "hidden" ? "on" : ""}">${m === "hidden" ? "Undo dismiss" : "✕ Not for me"}</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty">${jobs.size ? "No jobs match these filters." : "Results will appear here as they come in…"}</div>`;
}

$("chips").onclick = e => { const b = e.target.closest("[data-cat]"); if (b) { activeCat = b.dataset.cat; render(); } };
$("list").onclick = e => {
  const b = e.target.closest("[data-mark]"); if (!b) return;
  const { id, mark } = b.dataset;
  if (marks[id] === mark) delete marks[id]; else marks[id] = mark;
  store.set("jf_marks", marks); render();
};
["filter","sort","show"].forEach(id => $(id).addEventListener("input", render));

$("csv").onclick = () => {
  const rows = [["Title","Company","Location","Posted","Source","Categories","Status","Link"]];
  for (const j of visibleJobs()) rows.push([j.title, j.company, j.location, j.posted, j.source, [...j.cats].join("; "), marks[j.id] || "", j.url]);
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `jobs-${$("country").value.trim().replace(/\W+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

function renderLinks(country) {
  const c = encodeURIComponent(country);
  const q = encodeURIComponent("psychology OR \"research assistant\" OR \"mental health\" OR wellbeing OR \"learning and development\"");
  const links = [
    ["Google Jobs", `https://www.google.com/search?q=${encodeURIComponent("psychology research mental health jobs in " + country)}&ibp=htl;jobs`],
    ["Indeed", `https://www.indeed.com/jobs?q=${q}&l=${c}&sort=date`],
    ["Glassdoor", `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${encodeURIComponent("psychology")}&locKeyword=${c}`],
    ["ReliefWeb (NGO & humanitarian)", `https://reliefweb.int/jobs?search=${encodeURIComponent("(psychosocial OR \"mental health\" OR research) AND " + country)}`],
    ["UNjobs", `https://unjobs.org/search/${encodeURIComponent("psychosocial " + country)}`],
    ["Idealist (non-profits)", `https://www.idealist.org/en/jobs?q=${encodeURIComponent("psychology")}&searchMode=true&locationType=&location=${c}`],
    ["Devex", `https://www.devex.com/jobs/search?query=${encodeURIComponent("psychosocial " + country)}`],
    ["Academic jobs (jobs.ac.uk / global)", `https://www.jobs.ac.uk/search/?keywords=${encodeURIComponent("psychology " + country)}`],
    ["HigherEdJobs", `https://www.higheredjobs.com/search/advanced_action.cfm?Keyword=${encodeURIComponent("psychology")}`],
  ];
  const lc = country.toLowerCase();
  if (lc === "india") links.push(["Naukri", "https://www.naukri.com/psychology-jobs"], ["Internshala", "https://internshala.com/jobs/psychology-jobs/"], ["Foundit", "https://www.foundit.in/srp/results?query=psychology"]);
  if (["united kingdom","uk","england","scotland","wales"].includes(lc)) links.push(["NHS Jobs", "https://www.jobs.nhs.uk/candidate/search/results?keyword=psychology&sort=publicationDateDesc"], ["Charity Job", "https://www.charityjob.co.uk/jobs?keywords=psychology"]);
  if (["united arab emirates","uae","saudi arabia","qatar","oman","kuwait","bahrain"].includes(lc)) links.push(["Bayt", `https://www.bayt.com/en/international/jobs/psychology-jobs/?q=${c}`], ["GulfTalent", "https://www.gulftalent.com/jobs/search?keywords=psychology"]);
  if (lc === "australia") links.push(["SEEK", "https://www.seek.com.au/psychology-jobs"]);
  if (lc === "new zealand") links.push(["SEEK NZ", "https://www.seek.co.nz/psychology-jobs"]);
  if (["united states","usa","us"].includes(lc)) links.push(["USAJobs", "https://www.usajobs.gov/search/results/?k=psychology&s=startdate&sd=desc"]);
  if (lc === "canada") links.push(["Job Bank", "https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring=psychology&sort=D"]);
  $("linksCountry").textContent = country;
  $("links").innerHTML = links.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("");
  $("linksCard").hidden = false;
}

loadCategories().then(restoreForm);
</script>
</body>
</html>
